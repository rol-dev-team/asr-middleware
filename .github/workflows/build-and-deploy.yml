name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/asr-middleware-backend
  APP_DIR: /home/itbilling/Projects/asr-middleware
  DEPLOY_COMPOSE: docker-compose.deploy.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          envs: IMAGE_NAME,APP_DIR,DEPLOY_COMPOSE
          script: |
            set -e
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Pull latest compose file directly from GitHub (no scp needed)
            REPO="${{ github.server_url }}/${{ github.repository }}"
            RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/${{ env.DEPLOY_COMPOSE }}"
            curl -fsSL "$RAW_URL" -o "$DEPLOY_COMPOSE"

            cat > .env << 'ENVEOF'
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            ENVEOF
            chmod 600 .env

            docker pull "$IMAGE_NAME:latest"

            IMAGE_NAME="$IMAGE_NAME" docker compose -f "$DEPLOY_COMPOSE" up -d \
              --pull missing \
              --remove-orphans

            echo "==> Waiting for asr-middleware-backend to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' asr-middleware-backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend healthy after $((i * 5))s."
                break
              fi
              echo "  [$i/30] $STATUS - waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "==> ERROR: asr-middleware-backend failed to become healthy!"
              docker logs --tail 60 asr-middleware-backend
              exit 1
            fi

            echo "==> Last 60 lines of backend log:"
            docker logs --tail 60 asr-middleware-backend