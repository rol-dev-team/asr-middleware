name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/asr-middleware-backend
  APP_DIR: /home/itbilling/Projects/asr-middleware
  DEPLOY_COMPOSE: docker-compose.deploy.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      compose_b64: ${{ steps.encode.outputs.compose_b64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Encode compose file
        id: encode
        run: |
          echo "compose_b64=$(base64 -w 0 ${{ env.DEPLOY_COMPOSE }})" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Test SSH connectivity
        run: |
          nc -zv -w 10 ${{ secrets.VM_HOST }} ${{ secrets.VM_PORT }} \
            && echo "PORT OPEN" \
            || echo "PORT CLOSED/TIMEOUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          envs: IMAGE_NAME,APP_DIR,DEPLOY_COMPOSE,COMPOSE_B64
          script: |
            set -e
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write compose file decoded from base64
            echo "$COMPOSE_B64" | base64 -d > "$DEPLOY_COMPOSE"

            # Write .env from GitHub Secrets
            cat > .env << 'ENVEOF'
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            ENVEOF
            chmod 600 .env

            # Pull latest backend image
            docker pull "$IMAGE_NAME:latest"

            # Force remove all containers so compose takes full ownership
            # postgres_data volume is NEVER removed — data is safe
            docker rm -f \
              asr-middleware-backend \
              asr-middleware-worker \
              asr-middleware-redis \
              asr-middleware-db \
              2>/dev/null || true

            # Bring up full stack under this compose project
            IMAGE_NAME="$IMAGE_NAME" docker compose -f "$DEPLOY_COMPOSE" up -d \
              --pull missing \
              --remove-orphans

            # Wait for backend (entrypoint runs alembic upgrade head first)
            echo "==> Waiting for asr-middleware-backend to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' asr-middleware-backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend healthy after $((i * 5))s."
                break
              fi
              echo "  [$i/30] $STATUS - waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "==> ERROR: asr-middleware-backend failed to become healthy!"
              docker logs --tail 60 asr-middleware-backend
              exit 1
            fi

            echo "==> Last 60 lines of backend log (includes migration output):"
            docker logs --tail 60 asr-middleware-backend
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          APP_DIR: ${{ env.APP_DIR }}
          DEPLOY_COMPOSE: ${{ env.DEPLOY_COMPOSE }}
          COMPOSE_B64: ${{ needs.build-and-push.outputs.compose_b64 }}