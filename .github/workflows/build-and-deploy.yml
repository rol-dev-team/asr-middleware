name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.deploy.yml'
      - '.github/workflows/**'    # ← trigger when workflow itself changes
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/asr-middleware-backend
  IMAGE_TAG: sha-${{ github.sha }}
  APP_DIR: /home/itbilling/Projects/asr-middleware
  DEPLOY_COMPOSE: docker-compose.deploy.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      compose_b64: ${{ steps.encode.outputs.compose_b64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend          # ← build context is backend/
          file: ./backend/Dockerfile  # ← Dockerfile is inside backend/
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Encode compose file
        id: encode
        run: |
          # docker-compose.deploy.yml is at repo root
          echo "compose_b64=$(base64 -w 0 docker-compose.deploy.yml)" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Test SSH connectivity
        run: |
          nc -zv -w 10 ${{ secrets.VM_HOST }} ${{ secrets.VM_PORT }} \
            && echo "PORT OPEN" \
            || echo "PORT CLOSED/TIMEOUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_DIR,DEPLOY_COMPOSE,COMPOSE_B64
          script: |
            set -e
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write compose file decoded from base64
            echo "$COMPOSE_B64" | base64 -d > "$DEPLOY_COMPOSE"

            # Write .env from GitHub Secrets
            cat > .env << 'ENVEOF'
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            ENVEOF
            chmod 600 .env

            # Fail fast if required env vars are missing (prevents confusing runtime failures)
            for k in DB_USER DB_PASSWORD DB_NAME DB_PORT GEMINI_API_KEY SECRET_KEY ALGORITHM ACCESS_TOKEN_EXPIRE_MINUTES REFRESH_TOKEN_EXPIRE_DAYS BACKEND_PORT; do
              if ! grep -q "^${k}=" .env; then
                echo "==> ERROR: Missing ${k} in generated .env"
                exit 1
              fi
            done

            # Read DB credentials from .env without sourcing it (safer with arbitrary secret characters)
            DB_USER=$(grep -E '^DB_USER=' .env | head -n1 | cut -d= -f2-)
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | head -n1 | cut -d= -f2-)
            if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
              echo "==> ERROR: DB_USER/DB_PASSWORD missing in .env"
              exit 1
            fi

            # Pull the exact image built for this commit
            docker pull "$IMAGE_NAME:$IMAGE_TAG"

            # Force remove all containers so compose takes full ownership
            # postgres_data volume is NEVER removed — data is safe
            docker rm -f \
              asr-middleware-backend \
              asr-middleware-worker \
              asr-middleware-redis \
              asr-middleware-db \
              2>/dev/null || true

            # Start infrastructure first so we can safely ensure credentials match the persisted DB volume
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker compose -f "$DEPLOY_COMPOSE" up -d \
              --pull always \
              --remove-orphans \
              db redis

            echo "==> Waiting for asr-middleware-db to become healthy..."
            for i in $(seq 1 30); do
              DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' asr-middleware-db 2>/dev/null || echo "starting")
              if [ "$DB_STATUS" = "healthy" ]; then
                echo "  Database healthy after $((i * 2))s."
                break
              fi
              echo "  [$i/30] $DB_STATUS - waiting 2s..."
              sleep 2
            done

            if [ "$DB_STATUS" != "healthy" ]; then
              echo "==> ERROR: asr-middleware-db failed to become healthy!"
              docker logs --tail 120 asr-middleware-db || true
              exit 1
            fi

            echo "==> Syncing Postgres role password with current .env (persistent volume safe)..."
            docker exec asr-middleware-db \
              psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d postgres \
                -v target_role="$DB_USER" \
                -v target_password="$DB_PASSWORD" \
                -c "ALTER ROLE :\"target_role\" WITH PASSWORD :'target_password';"

            # Bring up application services under this compose project
            IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker compose -f "$DEPLOY_COMPOSE" up -d \
              --pull always \
              --remove-orphans \
              backend worker

            # Wait for backend (entrypoint.sh runs alembic upgrade head first)
            echo "==> Waiting for asr-middleware-backend to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' asr-middleware-backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend healthy after $((i * 5))s."
                break
              fi
              echo "  [$i/30] $STATUS - waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "==> ERROR: asr-middleware-backend failed to become healthy!"
              docker logs --tail 60 asr-middleware-backend
              exit 1
            fi

            echo "==> Last 60 lines of backend log (includes migration output):"
            docker logs --tail 60 asr-middleware-backend
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          APP_DIR: ${{ env.APP_DIR }}
          DEPLOY_COMPOSE: ${{ env.DEPLOY_COMPOSE }}
          COMPOSE_B64: ${{ needs.build-and-push.outputs.compose_b64 }}