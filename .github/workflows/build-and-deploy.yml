name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/asr-middleware
  APP_DIR: ${{ secrets.APP_DIR }}
  APP_ENV: ${{ secrets.APP_ENV }}
  APP_PORT: ${{ secrets.APP_PORT }}

jobs:

  # ──────────────────────────────────────────────────────────────────
  # JOB 1 — Build image and push to Docker Hub
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Build the backend image from ./backend
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}
          # Layer cache speeds up subsequent builds significantly
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to VM
  #   1. SCP docker-compose.yml to VM
  #   2. SSH: write .env from secrets
  #   3. SSH: docker pull + docker compose up
  #   4. SSH: wait for healthcheck + tail logs
  #
  #   Alembic migration runs automatically inside entrypoint.sh
  #   which is baked into the Docker image.
  # ──────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # Copy docker-compose.yml from repo root to VM
      # Path on VM: ~/Projects/asr-middleware/backend/docker-compose.yml
      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     ${{ secrets.VM_PORT || 22 }}
          source:   "docker-compose.yml"           # project root
          target:   ${{ env.APP_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     ${{ secrets.VM_PORT || 22 }}
          envs: IMAGE_NAME,APP_DIR
          script: |
            set -e
            cd "$APP_DIR"

            # Ensure expected paths exist
            mkdir -p backend

            # ── 1. Write .env from GitHub Secrets ───────────────────
            # heredoc keeps secrets off the process list and out of
            # shell history. File is chmod 600 (owner-read only).
            cat > backend/.env << 'ENVEOF'
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            APP_PORT=${{ secrets.APP_PORT }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            APP_ENV=${{ secrets.APP_ENV }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            ENVEOF
            chmod 600 backend/.env

            # ── 2. Pull the freshly built image ─────────────────────
            BACKEND_IMAGE="$IMAGE_NAME:latest"
            docker pull "$BACKEND_IMAGE"

            # ── 3. Bring up the stack with compose ──────────────────
            # Keep DB + Redis running; update backend + worker to the new image.
            # The postgres_data volume is NEVER removed here.
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose up -d db redis
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose pull backend worker

            # Gracefully stop worker first (let it finish in-flight tasks)
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose stop -t 60 worker || true

            # Update backend first
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose up -d --no-deps --remove-orphans backend

            # ── 4. Wait for backend healthcheck ─────────────────────
            echo "==> Waiting for asr-middleware-backend to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' asr-middleware-backend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "  Backend healthy after $((i * 5))s."
                break
              fi
              echo "  [$i/30] $STATUS — waiting 5s..."
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "==> ERROR: asr-middleware-backend failed to become healthy!"
              echo "==> Last 60 lines of backend log:"
              docker logs --tail 60 asr-middleware-backend
              exit 1
            fi

            # Bring worker back after backend is confirmed healthy
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose up -d --no-deps --remove-orphans worker

            # ── 5. Show recent logs (includes migration output) ──────
            echo "==> Last 60 lines of backend log:"
            docker logs --tail 60 asr-middleware-backend

            # ── 6. Fix media permissions ────────────────────────────
            sudo chmod -R 777 ~/Projects/asr-middleware/backend/media
            docker exec -u root asr-middleware-backend chmod -R 777 /app/media