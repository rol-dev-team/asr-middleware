services:
  db:
    image: postgres:16-alpine
    container_name: asr-middleware-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-ASRMiddleware}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asr-middleware-redis
    networks:
      - asr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-sakibsibly/asr-middleware:latest}
    container_name: asr-middleware-backend
    env_file:
      - ./backend/.env
    environment:
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ASRMiddleware}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ASRMiddleware}
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    volumes:
      - ./backend/media:/app/media
    networks:
      - asr-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: asr-middleware-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - asr-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:-sakibsibly/asr-middleware:latest}
    container_name: asr-middleware-worker
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ASRMiddleware}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]
    volumes:
      - ./backend/media:/app/media
    networks:
      - asr-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres_data:
    driver: local

networks:
  asr-network:
    driver: bridge
